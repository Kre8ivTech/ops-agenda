# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
# nosemgrep: package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
# Reason: minimumReleaseAge and trustPolicy are omitted because the current
# toolchain (Next.js 16, Vite/Rollup platform binaries) publishes platform-specific
# packages on the same release cycle, causing pnpm to reject valid updates with
# false-positive "trust downgrade" errors. Re-enable once the ecosystem matures.
packages:
  - 'packages/*'

# Security: only allow packages from the default registry to be installed as
# transitive dependencies; block git/tarball/local exotic sub-dependencies.
# minimumReleaseAge and trustPolicy are intentionally omitted because the
# current toolchain (Next.js 16, Vite/Rollup platform binaries) publishes
# platform-specific packages on the same release cycle, causing pnpm to reject
# valid updates with false-positive "trust downgrade" errors. Re-enable once the
# ecosystem matures or per-package exclusions become maintainable.
blockExoticSubdeps: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
