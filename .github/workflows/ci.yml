name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Real config comes from SSM Parameter Store at runtime; CI only needs the
  # code to compile and the tests to pass.
  SKIP_ENV_VALIDATION: 'true'

jobs:
  static:
    name: Typecheck / Lint / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI package
        run: pnpm --filter @ops-agenda/ui build
      - run: pnpm typecheck
      - name: Lint changed code
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          web_files=()
          marketing_files=()
          ui_files=()
          infra_files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              packages/web/*) web_files+=("${file#packages/web/}") ;;
              packages/marketing/*) marketing_files+=("${file#packages/marketing/}") ;;
              packages/ui/*) ui_files+=("${file#packages/ui/}") ;;
              packages/infra/*) infra_files+=("${file#packages/infra/}") ;;
            esac
          done < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- \
              '*.js' '*.mjs' '*.cjs' '*.ts' '*.mts' '*.cts' '*.tsx'
          )

          if (( ${#web_files[@]} > 0 )); then
            pnpm --dir packages/web exec eslint "${web_files[@]}"
          fi
          if (( ${#marketing_files[@]} > 0 )); then
            pnpm --dir packages/marketing exec eslint "${marketing_files[@]}"
          fi
          if (( ${#ui_files[@]} > 0 )); then
            pnpm --dir packages/ui exec eslint "${ui_files[@]}"
          fi
          if (( ${#infra_files[@]} > 0 )); then
            pnpm --dir packages/infra exec eslint "${infra_files[@]}"
          fi
      - name: Check formatting on changed code
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- \
              '*.js' '*.mjs' '*.cjs' '*.ts' '*.mts' '*.cts' '*.tsx' \
              '*.json' '*.yml' '*.yaml' '*.css'
          )
          if (( ${#files[@]} == 0 )); then
            echo "No changed code files require formatting checks."
            exit 0
          fi

          pnpm exec prettier --check "${files[@]}"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI package
        run: pnpm --filter @ops-agenda/ui build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: packages/web/coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI package
        run: pnpm --filter @ops-agenda/ui build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        run: pnpm --filter @ops-agenda/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  infra:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Synth needs no AWS credentials and catches invalid stack changes before
      # any deploy job assumes a role via OIDC.
      - run: pnpm synth
